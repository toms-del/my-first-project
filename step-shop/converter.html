<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ფოტოს გადამყვანი | Step</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 16px; text-align: center; background: var(--surface); cursor: pointer; }
    .drop.over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--surface)); }
    .items { display: grid; gap: 14px; margin-top: 20px; }
    .conv { display: grid; grid-template-columns: 120px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
    .conv img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; }
    .conv .meta { display: grid; gap: 8px; }
    .ok { color: #1b8a4b; } .bad { color: var(--danger); }
    @media (max-width: 560px) { .conv { grid-template-columns: 90px 1fr; } .conv .btn { grid-column: 1 / -1; } .conv img { width: 90px; height: 68px; } }
  </style>
</head>
<body>
  <header id="app-header" class="site-header"></header>
  <main class="container section narrow" style="width:min(820px,92%)">
    <h1>ფოტოს გადამყვანი</h1>
    <p class="lead">ჩააგდე ყველა ფოტო ერთად. თუ ფაილის სახელში პროდუქტის სახელია (მაგ. <code>iphone14.jpg</code>, <code>sony-wh1000xm5.png</code>), პროდუქტს თვითონ მივაბამ. შემდეგ ჩამოტვირთე ერთი <strong>ZIP</strong>, ამოარქივე და ფაილები ჩააგდე <code>img/</code> საქაღალდეში.</p>

    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/*" multiple hidden>
      <strong>📷 გადმოათრიე ფოტოები აქ ან დააჭირე არჩევას</strong>
      <p class="muted small">ფოტო ავტომატურად დაპატარავდება (მაქს. 900px) და ზომას 2 MB-ში ჩავატევთ.</p>
    </label>

    <div class="row gap wrap" style="margin-top:16px">
      <button id="zip-btn" class="btn" disabled>⬇ ჩამოტვირთე ყველა (ZIP)</button>
      <span id="zip-info" class="muted small"></span>
    </div>

    <div id="items" class="items"></div>
  </main>
  <footer id="app-footer" class="site-footer"></footer>

  <script type="module">
    import { renderLayout, h } from './js/ui.js';
    renderLayout('');

    // რომელ ფაილს რომელი პროდუქტი შეესაბამება (data/products.json)
    // მესამე ელემენტი: საკვანძო სიტყვები ფაილის სახელში ავტომატური დაწყვილებისთვის
    const TARGETS = [
      ['p-phone1', 'Samsung Galaxy S24', ['s24', 'galaxy-s', 'galaxys']],
      ['p-phone2', 'iPhone 14', ['iphone']],
      ['p-phone3', 'Xiaomi Redmi Note 13', ['redmi', 'xiaomi']],
      ['p-laptop1', 'Lenovo IdeaPad 3', ['lenovo', 'ideapad']],
      ['p-laptop2', 'HP Pavilion 14', ['pavilion', 'hp']],
      ['p-headphones', 'Sony WH-1000XM5', ['wh1000', 'wh-1000', 'xm5', 'headphone']],
      ['p-speaker', 'JBL Flip 6', ['jbl', 'flip']],
      ['p-tv', 'LG 55" 4K Smart TV', ['tv', 'lg']],
      ['p-mouse', 'Logitech MX Master 3S', ['mouse', 'mx-master', 'mxmaster', 'logitech']],
      ['p-console', 'PlayStation 5 Slim', ['ps5', 'playstation', 'console']],
      ['p-tablet', 'iPad 10th Gen 64GB', ['ipad', 'tablet']],
      ['p-watch', 'Samsung Galaxy Watch6 44mm', ['watch']],
      ['p-camera', 'Canon EOS R50 Kit', ['canon', 'camera', 'eos']],
      ['p-monitor', 'Dell 27" QHD მონიტორი', ['dell', 'monitor']],
      ['p-keyboard', 'Keychron K2 უსადენო კლავიატურა', ['keychron', 'keyboard']],
      ['p-router', 'TP-Link Archer AX55 Wi-Fi 6', ['router', 'tplink', 'tp-link', 'archer']],
      ['p-powerbank', 'Anker Power Bank 20000mAh', ['anker', 'powerbank', 'power-bank']],
      ['p-earbuds', 'AirPods Pro 2', ['airpods', 'earbuds']],
      ['p-laptop3', 'ASUS ROG Strix G16', ['asus', 'rog', 'strix']],
      ['p-controller', 'Xbox Wireless Controller', ['xbox', 'controller']],
      ['p-ssd', 'Samsung T7 Portable SSD 1TB', ['ssd', 't7', 'samsung-t7']],
      ['p-webcam', 'Logitech C920 HD Pro Webcam', ['webcam', 'c920']],
      ['p-gheadset', 'HyperX Cloud II Gaming Headset', ['hyperx', 'cloud', 'gaming-headset', 'gheadset']],
      ['p-drone', 'DJI Mini 4 Pro', ['dji', 'drone', 'mini-4']],
      ['p-printer', 'Canon PIXMA G3430 პრინტერი', ['printer', 'pixma']],
      ['p-vacuum', 'Xiaomi Robot Vacuum S10', ['vacuum', 'robot', 's10']],
      ['p-ereader', 'Kindle Paperwhite 16GB', ['kindle', 'ereader', 'e-reader', 'paperwhite']],
      ['p-mic', 'Blue Yeti USB მიკროფონი', ['yeti', 'microphone', 'mic']],
      ['p-band', 'Xiaomi Smart Band 8', ['band', 'mi-band', 'smart-band']],
      ['p-switch', 'Nintendo Switch OLED', ['switch', 'nintendo']],
      ['hero', 'მთავარი გვერდის ბანერი (1600px)', ['hero', 'banner']],
    ];

    // ფაილის სახელით პროდუქტის გამოცნობა (თუ ვერ გამოიცნო, პირველს ვანიჭებთ)
    function guessTarget(filename) {
      const name = filename.toLowerCase().replace(/\.[^.]+$/, '').replace(/[\s_]+/g, '-');
      const exact = TARGETS.find(([id]) => name === id || name === id.replace(/^p-/, ''));
      if (exact) return exact[0];
      const hit = TARGETS.find(([, , keys]) => keys.some((k) => name.includes(k)));
      return hit ? hit[0] : TARGETS[0][0];
    }

    const MAX_BYTES = 2 * 1024 * 1024;
    const drop = document.getElementById('drop');
    const input = document.getElementById('file');
    const items = document.getElementById('items');

    ['dragover', 'dragenter'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, () => drop.classList.remove('over')));
    drop.addEventListener('drop', (ev) => { ev.preventDefault(); handle(ev.dataTransfer.files); });
    input.addEventListener('change', () => handle(input.files));

    const entries = []; // { file, select, status, blob }
    const zipBtn = document.getElementById('zip-btn');
    const zipInfo = document.getElementById('zip-info');

    function handle(files) {
      [...files].filter((f) => f.type.startsWith('image/')).forEach(addItem);
    }

    async function toWebp(file, maxWidth) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxWidth / bitmap.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      for (const q of [0.85, 0.75, 0.65, 0.5]) {
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/webp', q));
        if (blob && blob.size <= MAX_BYTES) return blob;
      }
      throw new Error('2 MB-ში ვერ ჩაეტია');
    }

    function download(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // ---------- ZIP (შეუკუმშავი, ბიბლიოთეკის გარეშე) ----------
    const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      return c >>> 0;
    });
    function crc32(bytes) {
      let crc = 0xffffffff;
      for (const b of bytes) crc = CRC_TABLE[(crc ^ b) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }
    async function makeZip(files) { // files: [{ name, blob }]
      const enc = new TextEncoder();
      const parts = [];
      const central = [];
      let offset = 0;
      for (const { name, blob } of files) {
        const data = new Uint8Array(await blob.arrayBuffer());
        const nameBytes = enc.encode(name);
        const crc = crc32(data);
        const local = new DataView(new ArrayBuffer(30));
        local.setUint32(0, 0x04034b50, true);
        local.setUint16(4, 20, true);
        local.setUint16(6, 0x0800, true); // UTF-8 სახელები
        local.setUint32(14, crc, true);
        local.setUint32(18, data.length, true);
        local.setUint32(22, data.length, true);
        local.setUint16(26, nameBytes.length, true);
        parts.push(local.buffer, nameBytes, data);

        const cd = new DataView(new ArrayBuffer(46));
        cd.setUint32(0, 0x02014b50, true);
        cd.setUint16(4, 20, true);
        cd.setUint16(6, 20, true);
        cd.setUint16(8, 0x0800, true);
        cd.setUint32(16, crc, true);
        cd.setUint32(20, data.length, true);
        cd.setUint32(24, data.length, true);
        cd.setUint16(28, nameBytes.length, true);
        cd.setUint32(42, offset, true);
        central.push(cd.buffer, nameBytes);
        offset += 30 + nameBytes.length + data.length;
      }
      const cdSize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, files.length, true);
      end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true);
      end.setUint32(16, offset, true);
      return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
    }

    function updateZipButton() {
      const ready = entries.filter((e) => e.blob);
      zipBtn.disabled = ready.length === 0;
      // ერთ პროდუქტზე რამდენიმე ფოტო თუ აირჩია, ბოლო გადაფარავს
      const names = ready.map((e) => e.select.value);
      const dup = names.length - new Set(names).size;
      zipInfo.textContent = ready.length
        ? `${ready.length} ფაილი მზადაა${dup ? ` (⚠️ ${dup} პროდუქტს რამდენიმე ფოტო აქვს, ბოლო ჩაიწერება)` : ''}`
        : '';
    }

    zipBtn.addEventListener('click', async () => {
      const byName = new Map();
      for (const e of entries) if (e.blob) byName.set(`${e.select.value}.webp`, e.blob);
      const files = [...byName].map(([name, blob]) => ({ name, blob }));
      download(await makeZip(files), 'step-images.zip');
    });

    async function addItem(file) {
      const preview = h('img', { src: URL.createObjectURL(file), alt: '' });
      const select = h('select', {}, TARGETS.map(([id, label]) => h('option', { value: id }, `${label} (${id}.webp)`)));
      select.value = guessTarget(file.name);
      const status = h('span', { class: 'small muted' }, 'მუშავდება...');
      const btn = h('button', { class: 'btn btn-small btn-outline', disabled: '' }, '⬇ ერთი ფაილი');
      const entry = { file, select, status, blob: null };
      entries.push(entry);

      btn.addEventListener('click', () => download(entry.blob, `${select.value}.webp`));

      const run = async () => {
        status.className = 'small muted';
        status.textContent = 'მუშავდება...';
        try {
          entry.blob = await toWebp(file, select.value === 'hero' ? 1600 : 900);
          status.className = 'small ok';
          status.textContent = `✅ მზადაა: ${(entry.blob.size / 1024).toFixed(0)} KB`;
          btn.disabled = false;
        } catch (err) {
          entry.blob = null;
          status.className = 'small bad';
          status.textContent = `❌ ${err.message}`;
          btn.disabled = true;
        }
        updateZipButton();
      };
      select.addEventListener('change', run);

      items.append(h('div', { class: 'conv' }, preview, h('div', { class: 'meta' }, h('strong', {}, file.name), select, status), btn));
      run();
    }
  </script>
</body>
</html>
